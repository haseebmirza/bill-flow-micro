services:
  mariadb:
    image: mariadb:11
    container_name: billflow-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: billflow_payments
      MARIADB_USER: billflow
      MARIADB_PASSWORD: billflow_secret
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: billflow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: billflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-api:
    build: ./payment-api
    container_name: billflow-payment-api
    ports:
      - "8001:8001"
    environment:
      APP_KEY: base64:some_random_key_here_replace_later
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: billflow_payments
      DB_USERNAME: billflow
      DB_PASSWORD: billflow_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: billflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: billflow_invoices
      POSTGRES_USER: billflow
      POSTGRES_PASSWORD: billflow_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billflow -d billflow_invoices"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: ./notification-service
    container_name: billflow-notification-service
    ports:
      - "8003:8003"
    environment:
      KAFKA_BROKERS: kafka:29092
      PORT: "8003"
    depends_on:
      kafka:
        condition: service_healthy

  invoice-service:
    build: ./invoice-service
    container_name: billflow-invoice-service
    ports:
      - "8002:8002"
    environment:
      INVOICE_DATABASE_URL: postgresql://billflow:billflow_secret@postgres:5432/billflow_invoices
      INVOICE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVOICE_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: billflow-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: billflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka

  dashboard:
    build: ./dashboard
    container_name: billflow-dashboard
    ports:
      - "5173:5173"

volumes:
  mariadb_data:
  postgres_data:
